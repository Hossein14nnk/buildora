<!DOCTYPE html>
<html dir="ltr" lang="en" class="w-100 h-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagination</title>
    <link rel="icon" type="image/png" href="./assets/media/images/en/logo.webp">
    <base href="../../../../../">
    <link rel="stylesheet" href="./assets/icons/fontawesome-free-7.3.1-web/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/miz.min.css">
    <link rel="stylesheet" href="./assets/css/style.min.css">
</head>
<body class="font-roboto w-100 h-100">
<div class=" w-100 h-100 d-flex align-items-center justify-content-center">
    

<nav class="pagination" aria-label="Pagination">

    

        

            <button
                class="pagination-item active"
                type="button"
            >
                1
            </button>

        

    

        

            <button
                class="pagination-item "
                type="button"
            >
                2
            </button>

        

    

        

            <button
                class="pagination-item "
                type="button"
            >
                3
            </button>

        

    

        

            <span class="pagination-item pagination-dots">
                ...
            </span>

        

    

        

    

        

            <button
                class="pagination-item "
                type="button"
            >
                6
            </button>

        

    

        

            <button
                class="pagination-item "
                type="button"
            >
                7
            </button>

        

    

    <button class="pagination-item pagination-next" type="button">
        <i class="fa-solid fa-arrow-right"></i>
    </button>

</nav>

</div>

    <script src="./assets/js/mizchin.min.js"></script>
</body>

</html>
