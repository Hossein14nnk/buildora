<!DOCTYPE html>
<html dir="ltr" lang="en" class="w-100 h-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact-info</title>
    <link rel="icon" type="image/png" href="./assets/media/images/en/logo.webp">
    <base href="../../../../../">
    <link rel="stylesheet" href="./assets/icons/fontawesome-free-7.3.1-web/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/miz.min.css">
    <link rel="stylesheet" href="./assets/css/style.min.css">
</head>
<body class="font-roboto w-100 h-100">
<div class="bg-on-primary-color w-100 h-100 d-flex align-items-center justify-content-center">
    

<div class="contact-info">

    <h6 class="fw-bold on-secondary-color mb-5">
        CONTACT INFO
    </h6>

    <ul class="list-unstyled d-flex flex-column gap-2">

        

            <li class="d-flex gap-2 align-items-baseline w-fit-content">

                <i class="fa-solid fa-location primary-color"></i>

                <div class="d-flex flex-column justify-content-start ">

                    
                        <span class="on-secondary-color">
                            123 Construction Ave,
                        </span>
                    
                        <span class="on-secondary-color">
                            New York, NY 10001, USA
                        </span>
                    

                </div>

            </li>

        

            <li class="d-flex gap-2 align-items-baseline w-fit-content">

                <i class="fa-solid fa-light fa-phone primary-color"></i>

                <div class="d-flex flex-column justify-content-start number">

                    
                        <span class="on-secondary-color">
                            +1 212 555 7890
                        </span>
                    

                </div>

            </li>

        

            <li class="d-flex gap-2 align-items-baseline w-fit-content">

                <i class="fa-solid fa-envelope primary-color"></i>

                <div class="d-flex flex-column justify-content-start ">

                    
                        <span class="on-secondary-color">
                            info@Buildora.com
                        </span>
                    

                </div>

            </li>

        

            <li class="d-flex gap-2 align-items-baseline w-fit-content">

                <i class="fa-solid fa-clock primary-color"></i>

                <div class="d-flex flex-column justify-content-start ">

                    
                        <span class="on-secondary-color">
                            Mon – Sat: 8:00 AM – 6:00 PM
                        </span>
                    

                </div>

            </li>

        

    </ul>

</div>

</div>

    <script src="./assets/js/mizchin.min.js"></script>
</body>

</html>
